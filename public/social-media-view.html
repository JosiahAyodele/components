<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
 <div class="container grid h-screen w-full place-content-center">
  <div class="card flex flex-col justify-evenly gap-6 rounded-md bg-gray-300 p-8">
    <div class="upper-part flex gap-x-4">
      <img src="https://images.pexels.com/photos/3586798/pexels-photo-3586798.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="" class="h-28 w-28 rounded-full object-cover" />
      <div class="metrics-and-buttons flex flex-col justify-evenly gap-y-4">
        <div class="metrics flex gap-x-6">
          <div class="connections">
            <p class="text-center text-lg font-bold">100+</p>
            <h3 class="text-gray-600">Connections</h3>
          </div>
          <div class="following">
            <p class="text-center text-lg font-bold">78</p>
            <h3 class="text-gray-600">Following</h3>
          </div>
          <div class="followers">
            <p class="text-center text-lg font-bold">10.7K</p>
            <h3 class="text-gray-600">Followers</h3>
          </div>
        </div>
        <div class="buttons flex justify-evenly gap-x-3">
          <button class="btn">Follow</button>
          <button class="btn">Message</button>
        </div>
      </div>
    </div>
    <div class="middle-part">
      <h1 class="name text-2xl font-semibold">Justin Brown</h1>
      <p class="description text-gray-600">Backend Developer | Croatia</p>
    </div>
    <div class="end-part flex items-center gap-x-1">
      <button class="inline-flex grow items-center justify-center gap-x-4 rounded-full bg-blue-700 p-4 text-lg text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
        </svg>
        <span>Connect</span>
      </button>
      <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="h-16 w-16 cursor-pointer text-blue-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </div>
</div>

</body>
</html>
