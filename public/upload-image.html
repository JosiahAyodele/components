<!doctype html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
 <div class="grid h-screen w-screen place-content-center bg-gray-400">
  <div class="card flex h-auto w-96 flex-col justify-around gap-y-4 rounded-sm bg-white p-4">
    <div class="upper-part flex justify-between">
      <p class="font-bold">Upload CSV</p>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 cursor-pointer">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>
    <hr/>
    <div class="flex flex-col items-center gap-y-4 rounded-sm border-4 border-dotted py-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-full border-4 border-blue-500 border-t-gray-300 p-7 font-semibold">70%</div>
      <p class="font-semibold">Uploading file...</p>
      <button class="rounded-md border-2 p-1 shadow">Cancel</button>
    </div>
    <div>
      <p class="text-xs font-semibold">Or upload from URL</p>
    </div>
    <!-- Understand the classes and implementation -->
    <div class="relative">
      <input type="uplaod" id="upload" class="w-full rounded-md border border-gray-300 bg-gray-50 p-4 text-sm text-gray-900" placeholder="Add the file URL" />
      <button type="submit" class="absolute right-2.5 bottom-2.5 rounded-md bg-gray-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300">Upload</button>
    </div>
  </div>
</div>
