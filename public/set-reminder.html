<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
 <div class="grid h-screen w-screen place-content-center bg-neutral-400">
  <div class="flex w-80 flex-col gap-y-6 rounded-xl bg-white p-6">
    <div class="component-1 flex justify-between font-semibold">

    </div>
    <div class="component-2 flex justify-between">

      </svg>
      <p class="font-semibold">December 2020</p>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="5" stroke="currentColor" class="h-3 w-3 shadow-lg">

      </svg>
    </div>
    <div class="component-3 flex flex-col gap-y-2">

        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
      </div>
      <div class="flex justify-between">
        <p>7</p>
        <p>8</p>
        <p class="self-center rounded-md py-1 px-2 text-blue-500 outline outline-blue-600">9</p>
        <p>10</p>
        <p>11</p>
        <p class="self-center rounded-md bg-blue-500 py-1 px-2 text-white">12</p>
        <p>13</p>
      </div>
      <div class="flex justify-between">
        <p>14</p>
        <p>15</p>
        <p>16</p>
        <p>17</p>
        <p>18</p>
        <p>19</p>
        <p>20</p>
      </div>
      <div class="flex justify-between">
        <p>21</p>
        <p>22</p>
        <p>23</p>
        <p>24</p>
        <p>25</p>
        <p>26</p>
        <p>27</p>
      </div>

        <p>30</p>
        <p>31</p>
        <p class="text-gray-400">1</p>
        <p class="text-gray-400">2</p>
        <p class="text-gray-400">3</p>
      </div>
    </div>
    <div class="component-4 flex cursor-pointer gap-x-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6 p-0.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <p class="font-semibold text-gray-500">Add reminder</p>
    </div>
    <div class="component-5 flex gap-x-4">
      <button class="w-32 rounded-md bg-neutral-200 p-2 font-semibold">Remove</button>
      <button class="w-32 rounded-md bg-blue-500 px-2 py-3 text-white">Done</button>
    </div>
  </div>
</div>

</body>
</html>
