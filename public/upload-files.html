 <div class="grid h-screen w-screen place-content-center bg-gray-200">
  <div class="flex h-auto w-80 flex-col gap-y-7 rounded-md bg-white p-7 shadow-2xl">

      <p class="text-center text-xs text-slate-500">Upload documents you want to share with your team.</p>
    </div>

    <div class="flex h-40 w-full flex-col items-center justify-center gap-y-2 rounded-md border-4 border-dotted border-gray-300 bg-slate-100">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-10 w-10 text-blue-700 opacity-50">

      <button class="rounded-md bg-blue-600 py-2 px-5 text-xs text-white shadow-xl">Browse files</button>
    </div>
    <!-- Uploaded/Uploading Images section -->
    <div class="flex flex-col">
      <p class="text-xs text-slate-500">Uploaded files</p>
      <div class="uploaded-image flex pt-3 items-center justify-between shadow-lg p-2">

          </svg>
        </div>
        <div class="file-name-progress-indicator flex flex-col gap-y-1">
          <div class="file-name flex gap-x-12">
            <p class="text-xs">Tailwind Components_283.pdf</p>
            <p class="text-xs">34%</p>
          </div>
          <hr class="h-1 bg-blue-500 rounded-md opacity-30">
        </div>
        <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>
        </div>
    </div>
      <div class="uploaded-image flex pt-2 items-center justify-between">
        <div class="file-type">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">

        <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>
        </div>
      </div>
    </div>
  </div>
</div>
